<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <title>카드 서바이벌</title>
    <meta name="theme-color" content="#0d0a10" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="카드 서바이벌" />
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="icon" type="image/png" href="./icons/icon-192.png" />
    <link rel="apple-touch-icon" href="./icons/apple-touch-icon.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&family=Noto+Sans+KR:wght@400;700;900&display=swap" rel="stylesheet" />
  </head>
  <body>
    <canvas id="scene"></canvas>
    <div id="badges"></div>
    <div id="float-layer"></div>
    <svg id="arrow-layer"><defs>
      <marker id="arrowhead" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
        <path d="M0 0 10 5 0 10z" fill="#ffd34d" />
      </marker></defs>
      <path id="arrow-path" d="" />
    </svg>

    <div id="hud" class="hidden">
      <div id="stage-plaque">
        <div id="stage-title"></div>
        <div id="stage-sub"></div>
      </div>
      <div id="enemy-frame">
        <div id="enemy-portrait"></div>
        <div id="enemy-hp"></div>
        <div id="enemy-info">
          <div id="enemy-name"></div>
          <div id="enemy-mana"></div>
          <div id="enemy-hand"></div>
        </div>
      </div>
      <div id="hero-frame">
        <div id="hero-portrait"></div>
        <div id="hero-hp"></div>
        <button id="hero-power" title="">
          <span class="hp-cost">2</span>
          <span class="hp-icon"></span>
        </button>
      </div>
      <div id="deck-info">
        <button id="deck-btn" title="덱 보기"><span id="deck-count">0</span></button>
        <div id="discard-count" title="버린 카드"></div>
      </div>
      <button id="end-turn"><span>턴 종료</span></button>
      <div id="mana-bar"><div id="mana-text"></div><div id="mana-gems"></div></div>
      <div id="hand"></div>
      <div id="inspect"></div>
      <div id="aim-preview"></div>
      <div id="history"></div>
    </div>

    <div id="audio-ctrl">
      <button id="music-btn" aria-label="배경음"><svg viewBox="0 0 24 24"><path d="M9 18V5l11-2v13" /><circle cx="6" cy="18" r="3" /><circle cx="17" cy="16" r="3" /><path class="slash" d="M3 3l18 18" /></svg></button>
      <button id="sfx-btn" aria-label="효과음"><svg viewBox="0 0 24 24"><path d="M4 9v6h4l5 4V5L8 9z" /><path d="M16 8.5a5 5 0 0 1 0 7M18.5 6a8.5 8.5 0 0 1 0 12" /><path class="slash" d="M3 3l18 18" /></svg></button>
    </div>
    <div id="tooltip"></div>
    <div id="banner"></div>
    <div id="modal" class="hidden"></div>
    <div id="rotate-hint">
      <div class="phone"></div>
      <div>휴대폰을 <b>가로로</b> 돌려 주세요</div>
    </div>
    <div id="loading">
      <div class="loading-title">카드 서바이벌</div>
      <div class="loading-bar"><div id="loading-fill"></div></div>
      <div id="loading-text">에셋 불러오는 중…</div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
