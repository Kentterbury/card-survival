<!doctype html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>무기 위치 편집기 · 카드 서바이벌</title>
  <style>
    :root { --bg: #15110d; --panel: #221b14; --line: #4a3a26; --gold: #f2c35a; --text: #f1e6d2; --dim: #a8987e; }
    * { box-sizing: border-box; }
    html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text); font: 13px/1.45 system-ui, 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif; }
    #app { display: grid; grid-template-columns: 230px 1fr 300px; height: 100vh; }
    aside { background: var(--panel); border-right: 1px solid var(--line); overflow: auto; padding: 10px; }
    aside.right { border-right: none; border-left: 1px solid var(--line); }
    h1 { font-size: 15px; color: var(--gold); margin: 0 0 8px; }
    h2 { font-size: 12px; color: var(--gold); margin: 14px 0 6px; text-transform: none; }
    input[type=search] { width: 100%; padding: 6px 8px; background: #120e0a; color: var(--text); border: 1px solid var(--line); border-radius: 6px; }
    .filters { display: flex; gap: 4px; flex-wrap: wrap; margin: 6px 0; }
    .filters button, .btn { background: #3a2c1c; color: var(--text); border: 1px solid var(--line); border-radius: 6px; padding: 4px 8px; cursor: pointer; font: inherit; }
    .filters button.on, .btn.on { background: var(--gold); color: #2a1d0c; border-color: var(--gold); }
    .btn:hover { filter: brightness(1.15); }
    #list { list-style: none; margin: 6px 0 0; padding: 0; }
    #list li { padding: 5px 6px; border-radius: 6px; cursor: pointer; display: flex; justify-content: space-between; gap: 6px; }
    #list li:hover { background: #2e2418; }
    #list li.on { background: #4a3a1c; color: #fff; }
    #list li .w { color: var(--dim); font-size: 11px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 90px; }
    #list li .edited { color: var(--gold); }
    main { position: relative; }
    #view { width: 100%; height: 100%; display: block; }
    #hud { position: absolute; left: 10px; top: 10px; background: #000a; padding: 6px 10px; border-radius: 8px; pointer-events: none; }
    #hud b { color: var(--gold); }
    #help { position: absolute; left: 10px; bottom: 10px; background: #000a; padding: 6px 10px; border-radius: 8px; color: var(--dim); font-size: 12px; }
    #loading { position: absolute; inset: 0; display: grid; place-items: center; background: var(--bg); font-size: 15px; z-index: 5; }
    .row { display: grid; grid-template-columns: 18px 1fr 58px; gap: 6px; align-items: center; margin: 3px 0; }
    .row label { color: var(--dim); }
    .row input[type=number] { width: 100%; background: #120e0a; color: var(--text); border: 1px solid var(--line); border-radius: 4px; padding: 2px 4px; }
    .row input[type=range] { width: 100%; }
    .seg { display: flex; gap: 4px; flex-wrap: wrap; }
    select { width: 100%; background: #120e0a; color: var(--text); border: 1px solid var(--line); border-radius: 6px; padding: 4px; }
    textarea { width: 100%; height: 140px; background: #120e0a; color: #cfe8c0; border: 1px solid var(--line); border-radius: 6px; font: 11px/1.4 ui-monospace, monospace; }
    .note { color: var(--dim); font-size: 11px; margin: 4px 0; }
    .warn { color: #ffb08a; }
  </style>
</head>
<body>
  <div id="app">
    <aside>
      <h1>무기 위치 편집기</h1>
      <input type="search" id="search" placeholder="이름 검색 (예: 기사, 해골)" />
      <div class="filters" id="filters"></div>
      <ul id="list"></ul>
    </aside>
    <main>
      <canvas id="view"></canvas>
      <div id="hud"></div>
      <div id="help">왼쪽 드래그: 카메라 회전 · 오른쪽 드래그: 이동 · 휠: 확대/축소 · 무기의 화살표/고리를 끌어 옮기기/돌리기</div>
      <div id="loading">에셋 불러오는 중…</div>
    </main>
    <aside class="right">
      <h2>무기</h2>
      <div class="seg" id="hands"></div>
      <div class="note" id="scopeNote"></div>
      <div class="seg">
        <button class="btn on" id="scopeWeapon" title="이 무기를 든 모든 캐릭터에 적용">이 무기 전체</button>
        <button class="btn" id="scopeLook" title="지금 캐릭터에만 적용">이 캐릭터만</button>
      </div>

      <h2>위치 (cm)</h2>
      <div id="pos"></div>
      <h2>회전 (도)</h2>
      <div id="rot"></div>
      <h2>크기</h2>
      <div id="scale"></div>
      <div class="seg" style="margin-top:6px">
        <button class="btn on" id="gizmoMove">끌어서 이동</button>
        <button class="btn" id="gizmoRotate">끌어서 회전</button>
        <button class="btn" id="gizmoOff">기즈모 끄기</button>
        <button class="btn" id="reset">원래대로</button>
      </div>

      <h2>애니메이션</h2>
      <select id="clip"></select>
      <div class="seg" style="margin-top:6px">
        <button class="btn" id="play">⏸ 멈춤</button>
        <button class="btn" id="slow">0.25배</button>
        <button class="btn on" id="normal">1배</button>
      </div>
      <div class="row"><label>⏱</label><input type="range" id="time" min="0" max="1" step="0.001" value="0" /><span id="timeText">0.00</span></div>

      <h2>카메라</h2>
      <div class="seg">
        <button class="btn" id="camBody">전신</button>
        <button class="btn" id="camHand">무기 확대</button>
        <button class="btn" id="camFront">정면</button>
        <button class="btn" id="camTop">게임 시점</button>
      </div>

      <h2>저장</h2>
      <div class="note">고친 값은 이 브라우저에 자동 저장되고, 같은 브라우저로 게임을 열면 바로 반영되어 보입니다. 모두에게 적용하려면 아래 내용을 복사해 보내 주세요.</div>
      <textarea id="out" readonly></textarea>
      <div class="seg" style="margin-top:6px">
        <button class="btn" id="copy">복사</button>
        <button class="btn" id="download">파일로 받기</button>
        <button class="btn" id="clear">고친 값 모두 지우기</button>
      </div>
      <div class="note"><a href="./" style="color:var(--gold)">← 게임으로</a></div>
    </aside>
  </div>
  <script type="module" src="/src/tools/gripEditor.ts"></script>
</body>
</html>
